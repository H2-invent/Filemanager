name: Create Release

env:
  GITHUB_TOKEN: ${{ secrets.token }}

on:
  pull_request:
    branches:
      - main

jobs:
  version:
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Compute tag
        id: version
        uses: h2-invent/action-compute-tag@v2.2.0
        with:
          event-name: ${{ github.event_name }}
          base-ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.event.pull_request.base.ref }}
          pr-action: ${{ github.event.action }}
          pr-merged: ${{ github.event.pull_request.merged }}

      - name: Create new Release with semantic-version tag
        uses: ncipollo/release-action@v1
        id: create_release
        with:
          draft: false
          prerelease: false
          allowUpdates: true
          name: Release ${{ steps.version.outputs.version }}
          tag: ${{ steps.version.outputs.version }}
          bodyFile: RELEASE_NOTE.md

  docker_image:
    needs:
      - version
    uses: ./.github/workflows/task-docker.yml
    with:
      registry: reg.h2-invent.com
      dockerfile_path: './Dockerfile'
      directory: '.'
      version: ${{ needs.version.outputs.version }}
      tags: reg.h2-invent.com/filemanager/core:${{ needs.version.outputs.version }},reg.h2-invent.com/filemanager/core:latest
    secrets:
      docker_password: ${{ secrets.HARBOR_PUSH_PASSWORD }}
      docker_username: ${{ secrets.HARBOR_PUSH_USERNAME }}

